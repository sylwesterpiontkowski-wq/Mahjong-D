name: Build Mahjong-D APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Mahjong-D-complete-update.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project archive
        run: |
          unzip -o "Mahjong-D-complete-update.zip" -d .
          echo "Files in repository root:"
          ls -la
          if [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found in repository root."
            find . -maxdepth 4 -name "build.gradle.kts" -o -name "settings.gradle.kts"
            exit 1
          fi

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahjong-D-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
