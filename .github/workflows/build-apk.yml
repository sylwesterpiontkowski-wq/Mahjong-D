
name: Build Mahjong-D APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q Mahjong-D-complete.zip

      - name: Build APK
        working-directory: Mahjong-D-main
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mahjong-D-APK
          path: Mahjong-D-main/app/build/outputs/apk/debug/app-debug.apk
